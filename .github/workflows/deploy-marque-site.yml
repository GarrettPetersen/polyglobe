name: Deploy Marque & Reprisal website

on:
  push:
    branches:
      - master
    paths:
      - apps/marque-and-reprisal-site/**
      - .github/workflows/deploy-marque-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marque-and-reprisal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marque-and-reprisal-site
    env:
      PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/marque-and-reprisal-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test, build, and deploy
        run: npm run deploy
