name: Deploy Marque & Reprisal game

on:
  push:
    branches:
      - master
    paths:
      - apps/pixel-globe/**
      - examples/globe-demo/public/**
      - examples/globe-demo/package.json
      - examples/globe-demo/package-lock.json
      - package.json
      - package-lock.json
      - .github/workflows/deploy-pixel-globe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marque-and-reprisal-game-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/globe-demo/package-lock.json
            apps/pixel-globe/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install globe build dependencies
        run: npm ci --prefix examples/globe-demo

      - name: Install deployment tooling
        run: npm ci --prefix apps/pixel-globe

      - name: Test, build, and deploy
        run: npm run --prefix apps/pixel-globe deploy
